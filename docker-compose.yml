services:
  postgres:
    image: postgres:17-alpine
    container_name: leadcalling-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: leadcalling
    ports:
      - "5434:5432"
    volumes:
      - leadcalling-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d leadcalling"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  leadcalling-pgdata:
